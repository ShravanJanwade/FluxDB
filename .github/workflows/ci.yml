name: Verify FluxDB
on: [push, pull_request]

# A second push to the same branch supersedes the first; there is no value in
# finishing a run for a commit nobody will look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine and control plane (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fluxdb
      - run: cargo fmt --all -- --check
        working-directory: fluxdb
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: fluxdb
      # Covers the storage engine, the SQL subset, and the end-to-end control
      # plane tests that drive the real router over a temporary SQLite store.
      - run: cargo test --workspace --locked
        working-directory: fluxdb
      - run: cargo build --release --locked -p fluxdb-server
        working-directory: fluxdb
      # Creates an isolated authenticated server and exercises CRUD, exact
      # integer round trips, SQL, restarts, restore and both SDKs.
      - run: python scripts/smoke.py

  console:
    name: Console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fluxdb-studio/package-lock.json
      - run: npm ci
        working-directory: fluxdb-studio
      - run: npm run typecheck
        working-directory: fluxdb-studio
      - run: npx prettier --check "src/**/*.{ts,tsx,css}" "tests/**/*.{ts,tsx}"
        working-directory: fluxdb-studio
      - run: npm test
        working-directory: fluxdb-studio
      - run: npm run build
        working-directory: fluxdb-studio

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The deployment is one image containing the engine, the control plane and
      # the built console, so building it is the only way to know a deploy will
      # not fail after a green test run.
      - run: docker build --tag fluxdb:ci .
      - name: Boot the image and check it serves the API and the console
        run: |
          docker run --detach --name fluxdb-ci \
            --env FLUXDB_TOKEN="$(openssl rand -hex 32)" \
            --env FLUXDB_SESSION_SECRET="$(openssl rand -hex 32)" \
            --publish 8086:8086 fluxdb:ci
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8086/health > /dev/null; then break; fi
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:8086/health
          # The control plane must be up, with its showcase workspace seeded.
          curl --silent --fail http://127.0.0.1:8086/api/cloud/config | grep -q demo_project_id
          # The console is served from the same process, and a deep link has to
          # answer 200 with the application shell.
          curl --silent --fail http://127.0.0.1:8086/ | grep -q '<div id="root">'
          curl --silent --fail http://127.0.0.1:8086/app/p/demofluxdb99/query > /dev/null
          # And the token API must not be reachable without the token.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8086/api/v1/databases)" = "401"
      # Hosts that scale to zero set PERSIST_DIR: data written before a stop has
      # to be there after the next start, and the showcase must be re-seeded
      # rather than restored so its incident stays recent.
      - name: Archive the data directory on stop and restore it on the next start
        run: |
          persist="$RUNNER_TEMP/persist"
          mkdir -p "$persist" && chmod 777 "$persist"
          token="$(openssl rand -hex 32)"
          boot() {
            docker run --detach --name fluxdb-persist \
              --env FLUXDB_TOKEN="$token" \
              --env FLUXDB_SESSION_SECRET="$(openssl rand -hex 32)" \
              --env PERSIST_DIR=/persist --volume "$persist:/persist" \
              --publish 8087:8086 fluxdb:ci
            for _ in $(seq 1 60); do
              if curl --silent --fail http://127.0.0.1:8087/health > /dev/null; then return 0; fi
              sleep 2
            done
            docker logs fluxdb-persist
            return 1
          }
          boot
          python3 - "$token" <<'PY'
          import sys
          sys.path.insert(0, "sdk/python")
          from fluxdb import FluxDBClient
          client = FluxDBClient("http://127.0.0.1:8087", sys.argv[1])
          client.create_database("persisted")
          point = {"measurement": "cpu", "tags": {"host": "ci"}, "timestamp": "1700000000000000000", "fields": {"usage": 42.5}}
          assert client.write("persisted", [point])["written"] == 1
          PY
          docker stop --time 90 fluxdb-persist
          docker logs fluxdb-persist 2>&1 | grep '\[persist\] saved'
          docker rm fluxdb-persist
          tar -tzf "$persist/fluxdb-data.tar.gz" | grep -q persisted
          if tar -tzf "$persist/fluxdb-data.tar.gz" | grep -q tdemofluxdb99_production; then
            echo "The showcase was archived"; exit 1
          fi
          boot
          docker logs fluxdb-persist 2>&1 | grep '\[persist\] restored'
          python3 - "$token" <<'PY'
          import sys
          sys.path.insert(0, "sdk/python")
          from fluxdb import FluxDBClient
          client = FluxDBClient("http://127.0.0.1:8087", sys.argv[1])
          points = client.read("persisted")["points"]
          assert len(points) == 1 and points[0]["fields"]["usage"] == 42.5, points
          PY
          curl --silent --fail http://127.0.0.1:8087/api/cloud/config | grep -q demo_project_id
      - if: always()
        run: docker logs fluxdb-ci || true
      - if: always()
        run: docker logs fluxdb-persist || true
      - if: always()
        run: docker rm --force fluxdb-ci fluxdb-persist || true
