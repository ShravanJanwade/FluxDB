# Render Blueprint. One Docker service serves the API and the console.
#
# Before the first deploy, set these in the Render dashboard:
#
#   DATABASE_URL   A free managed Postgres connection string (Neon or
#                  Supabase). Render's own free web services have an ephemeral
#                  filesystem, so without this every account is lost on each
#                  redeploy. Include `?sslmode=require`.
#   PUBLIC_BASE_URL  https://<your-service>.onrender.com
#
# Optional, to enable GitHub sign-in — create an OAuth app whose callback is
# <PUBLIC_BASE_URL>/api/cloud/auth/github/callback:
#
#   GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET
services:
  - type: web
    name: fluxdb
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Render assigns PORT; the server binds 0.0.0.0 on it automatically.
      - key: FLUXDB_DATA_DIR
        value: /app/data
      - key: FLUXDB_STATIC_DIR
        value: /app/web
      # Generated once and kept across deploys by Render.
      - key: FLUXDB_TOKEN
        generateValue: true
      - key: FLUXDB_SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
